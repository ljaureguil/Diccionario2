                aar.sort();

                words = aro;

    function find(f, callback) {
        for (var i = 0; i < words.length; i++) {
            if (words[i].word == f) {
                textarea.value = words[i].definitions;
                setTimeout(function () { playtx(f + " meaning: " + textarea.value) }, 2000)
                if (words[i].aud != "") aud.src = words[i].aud;
                return;
            }
        }
        GetJson(linkapi + f, function (r) {

            //    try {
            if (r[0] == null || r[0] == undefined) {
                alert("no data for word: " + f);
                // return;
            } else {

                var ms = r[0].meanings[0].definitions;
                var ss = f + ": \n\n";
                var od = {};
                od.word = f;
                od.definitions = [];
                od.aud = ""
                ms.forEach((e, index) => {
                    var k = (1 + index) + ")." + e.definition + "\n\n";;
                    ss += k;
                    od.definitions.push(k);

                });
                var m = ss //.definition

                // textarea.value = m + "\n\n\n\n" + JSON.stringify(r).replace(/,/g, "\n").replace(/"/g, " ");
                textarea.value = m;
                playtx(f + " meaning: " + m)
                //  alert(m)

                var a = r[0].phonetics[0].audio; //JSON.stringify()
                if (a != undefined) {
                    aud.src = a;
                    od.aud = a;
                } else playtx(f);
                /////////////////////////////////////////////////////
                if (findInArd(f) === null) {
                    words.push(od);
                    UpdateJson(linkdicc, {
                        words: words
                    }, function () {
                        if (callback != undefined) callback()
                    }); //alert("new word added to a   rd")}

                }
            }
        });
    }

    function findInArd(w) {
        for (var i = 0; i < words.length; i++) {
            if (words[i].word == w) {
                return words[i];
            }
        }
        return null;
    }


    playtx = function (t) {
        const message = new SpeechSynthesisUtterance(t);
        window.speechSynthesis.speak(message);

    }

    addNewW = function (w) {
        GetJson(linkd, function (r) {
            obd = r;
            ar = r;
            var sk = ""
            if (ar.indexOf(w) === -1) ar.push(w);
            else {
                alert("Word already exist");
                return;
            }
            ar.sort();

            sk.innerHTML += "<option>" + w + "</option>";
            find(w);
            localStorage.setItem("diccionario", ar.toString());
            UpdateJson(linkd, ar);
            setUpSel(ar);
            sel.value = w;
            alert("word added...");
        });

    }

    addOwnDef = function (w) {
        var d = prompt("Enter your definition for '" + w + "':");
        if (d != null && d.trim() != "") {
            var od = findInArd(w);
            if (od != null) {
                od.definitions += "\n\nYour definition: " + d;
                UpdateJson(linkdicc, {
                    words: words
                }, function () {
                    alert("Definition added to word: " + w);
                    find(w); // Refresh the displayed definition
                });
            } else {
                alert("Word not found in dictionary.");
            }
        } else {
            alert("Definition cannot be empty.");
        }
    }


    setUpSel = function (ar) {
        ifrom.placeholder = "> 0 and < " + (ar.length - 1);
        ito.placeholder = "> from and <" + (ar.length - 1);
        //alert(ar)
        ar.sort();
        var s = "";
        for (var i = 0; i < ar.length; i++) {
            s += "<option>" + ar[i] + "</option>";
        }
        sel.innerHTML = s;
    }

    delw = function (w) {
        var i = ar.indexOf(w);
        alert(w)
        if (i >= 1) {
            if (confirm("Are you sure you want to delete '" + w + "'??")) {
                ar.splice(i, 1);
                localStorage.setItem("diccionario", ar.toString());
                UpdateJson(linkd, ar);
                setUpSel(ar);

            }

        }

    }
