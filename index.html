        aar.sort();

            var pr = aar[i].split("@@@");

    function shuffleArray2(array) {
        var temparray = array.slice(); // Create a copy of the original array
        for (let i = temparray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [temparray[i], temparray[j]] = [temparray[j], temparray[i]];
        }
        return temparray;
    }
    function shuffleArray(array) {
        //  var temparray = array.slice(); // Create a copy of the original array
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    setArTest = function () {

        for (var i = ifrom.value * 1; i < ito.value * 1; i++) {
            var els = crw(nwords[i]);
            arw.push(els.bword);
            ard.push(els.def);
        }
        shuffleArray(arw);
        shuffleArray(ard);

        for (var i = 0; i < arw.length; i++) {
            dw.appendChild(arw[i]);
            dt.appendChild(ard[i]);
        }
    }

    function crw(w) {
        var d = w.definitions;

        var ta = document.createElement("textarea");
        ta.value = d;
        ta.readOnly = true;
        ta.style = "font-weight:bold;" +
            "box-shadow: rgba(50, 50, 93, 0.925) 0px 20px 50px -10px, rgba(0, 0, 0, 0.93) 0px 10px 30px -10px;" +
            "width:90%;height:25%;font-size:12px;margin:10px; border-radius:5px;" +
            "background:white;"

        ta.name = w.word;
        ta.onclick = function () {
            defselected = this;
            // var wt=wselected.name;
            if (this.name === wselected.name) {
                this.value = wselected.name + ":\n\n" + this.value
                wselected.style.opacity = .42;
                this.style.opacity = .42;
                defselected = undefined;
                wselected = undefined;
                playtx(bien + nombre + this.value)

                ngood++;
                nresult++;

                psel.style.fontSize = "60px";
                setTimeout(function () { psel.style.fontSize = "20px" }, 3000)
                if (ngood >= this.parentElement.children.length) {

                    playtx(nn)
                    alert(nn)
                    clos.click();
                }
            }
            else {
                playtx(mal + nombre);//"sorry, you are wrong"
                psel.innerHTML = "Wrong..."
                psel.style.fontSize = "80px";
                nresult--;

                setTimeout(function () { psel.style.fontSize = "20px"; psel.innerHTML = "Selected word: " + wselected.name; }, 3000)
            }//alert("Wrong");
            defselected = undefined;

        };
        tw = document.createElement("button");
        tw.innerHTML = w.word;
        tw.name = w.word;
        tw.style = "width:90%;height:auto;font-size:18px;margin:25px;" +
            " box-shadow: rgba(50, 50, 93, 0.925) 0px 10px 30px -10px, rgba(0, 0, 0, 0.93) 0px 10px 30px -10px; ";
        tw.onclick = function () {
            playtx(this.name)
            var ae = dw.children;

            for (var i = 0; i < ae.length; i++) {
                ae[i].style.color = "white";
                ae[i].style.background = "#0088ff";
                ae[i].style.scale = "1 1"
            }

            this.style.color = "black"
            this.style.background = "white";
            this.style.scale = "1 2";

            psel.innerHTML = "Selected word: " + this.name;
            wselected = this;
            if (this.name === defselected.name) {

                defselected.value = defselected.value + ":\n\n" + defselected.value;
                playtx(bien + nombre + defselected.value)
                defselected.style.opacity = .42;
                this.style.opacity = .42;
                defselected = undefined;
                wselected = undefined;
                psel.innerHTML = "GOOD JOB . . . Keep going";
                psel.style.fontSize = "60px";
                ngood++;
                nresult++;

                setTimeout(function () { psel.style.fontSize = "20px" }, 3000)
                if (ngood >= this.parentElement.children.length) {
                    var nn = termina + "you have finish the test...:\n\nGoods: " + ngood + "\n\nWrong: " + (ngood - nresult) + "\n\nOver all result: " + nresult + "\n\n...The test dialoge will be close";
                    playtx(nn)

            wselected = undefined;
            //     psel.innerHTML = "";
