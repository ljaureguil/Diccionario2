    function sortar(words, callback) {
        var aar = [];
        var ar = words;
        for (var i = 0; i < ar.length; i++) {
            var o = JSON.stringify(ar[i]);
            var w = ar[i].word;
            aar.push(w + "@@@" + o)
        }
        aar.sort();
        for (var i = 0; i < aar.length; i++) {
            var pr = aar[i].split("@@@");
            var o = JSON.parse(pr[1]);
            words[i] = o;
        }
        if (callback != undefined) callback(words);


    }

                return;

        GetJson(linkapi + f, function (r) {

                    aud.src = a;
                    od.aud = a;
                } else playtx(f);

                obtemp = od;

                if (callback != undefined) callback(od)
            }
        });
    }

    function shuffleArray2(array) {
        var temparray = array.slice(); // Create a copy of the original array
        for (let i = temparray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [temparray[i], temparray[j]] = [temparray[j], temparray[i]];
        }
        return temparray;
    }
    function shuffleArray(array) {
        //  var temparray = array.slice(); // Create a copy of the original array
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }
